
[Settings]
; =========================
; 全局功能开关 / Global Switches
; =========================

# 开启更新
open_update = True
# 开启未匹配频道分类
open_unmatch_category = False
# 开启无结果频道分类
open_empty_category = False
# 开启显示更新时间
open_update_time = True
# 开启接口说明信息
open_url_info = False
# 开启 EPG 功能
open_epg = True
# 自动提取订阅源 EPG 地址
open_subscribe_epg = False
# 开启生成 M3U 文件
open_m3u_result = True

# 每个频道最终只保留一个播放地址
output_urls_limit = 1
# 旧版兼容别名
urls_limit = 1

# 更新时间显示位置
update_time_position = top
# 系统语言
language = zh_CN


; =========================
; 定时执行设置 / Scheduled Execution Settings
; =========================

# 定时执行模式
update_mode = interval
# 每隔 12 小时更新
update_interval = 12
# 指定更新时间
update_times =
# 启动时执行更新
update_startup = True
# 时区
time_zone = Asia/Shanghai


; =========================
; 结果输出 & 服务配置 / Output & Service
; =========================

# 模板文件路径
source_file = config/demo.txt
# 生成结果文件路径
final_file = output/result.txt
# 开启实时写入
open_realtime_write = True
# 开启页面服务
open_service = True
# HTTP 服务端口
service_port = 8080
# 公网完整访问地址
public_url =
# Flask 内部 API 端口
app_port = 5180
# 公网协议
public_scheme = http
# 公网 Host
public_domain = 127.0.0.1
# CDN 代理加速地址
cdn_url =
# HTTP 代理地址
http_proxy =


; =========================
; 数据源总开关 / Source Global Switches
; =========================

# 开启本地源
open_local = True
# 开启订阅源
open_subscribe = True
# 自动停用失效地址
open_auto_disable_source = False


; =========================
; 数据源工作模式 / Source Working Modes
; =========================

# 使用历史更新结果
open_history = True
# 使用 M3U 内含的请求头验证信息
open_headers = True
# 全局 User-Agent
user_agent =


; =========================
; 过滤 & 测速设置 / Filtering & Speed Test
; =========================

# 开启测速功能
open_speed_test = True

# 快速测速模式，适合 Render 免费版
speed_test_mode = quick

# 自动截图关闭，减少资源消耗
open_stream_screenshot = False
# 单个接口截图超时
stream_screenshot_timeout = 5
# 截图最大宽度
stream_screenshot_width = 640

# 开启分辨率过滤
open_filter_resolution = True
# 开启速率过滤
open_filter_speed = True
# 开启广告过滤
open_filter_ad = True

# 关闭全量测速，降低 CPU 和内存占用
open_full_speed_test = False

# 快速测速每个频道只需要一个有效结果
speed_test_target = 1
quick_test_target = 1

# 关闭补偿机制
open_supply = False

# 按速率从高到低排序
sort_by = speed

# 最低分辨率
min_resolution = 1280x720
# 最高分辨率
max_resolution = 3840x2160
# 最低速率（MiB/s）
min_speed = 0.5
# 分辨率与最低速率映射
resolution_speed_map = 1280x720:0.2,1920x1080:0.5,3840x2160:1.0

# 自动性能模式
performance_mode = auto
# 自动测速并发
speed_test_limit = 0
# 单个接口测速超时
speed_test_timeout = 10
# 不按 Host 共享测速数据
speed_test_filter_host = False

# 查询请求超时
request_timeout = 10


; =========================
; 网络协议 & 地域偏好 / Network & Region Preferences
; =========================

# 不强制认为当前网络支持 IPv6
ipv6_support = False
# 生成 IPv4 和 IPv6 接口
ipv_type = all
# 自动选择协议偏好
ipv_type_prefer = auto
# 不限制接口归属地
location =
# 不限制运营商
isp =


; =========================
; 结果排序偏好 / Result Ordering Preference
; =========================

# 不指定接口来源优先级
origin_type_prefer =


; =========================
; 本地源 / Local Source
; =========================

# 本地源偏好数量
local_num = 10


; =========================
; 订阅源 / Subscription Source
; =========================

# 订阅源偏好数量
subscribe_num = 10


; =========================
; 频道台标 / Channel Logo
; =========================

# 频道台标库
logo_url = https://www.xn--rgv465a.top/tvlogo
# 台标格式
logo_type = png
# 优先使用订阅源自带台标
open_subscribe_logo = True


; =========================
; RTMP 推流 / RTMP Push
; =========================

# 开启 RTMP 推流
open_rtmp = True
# Nginx HTTP 端口
nginx_http_port = 8080
# Nginx RTMP 端口
nginx_rtmp_port = 1935
# 无人观看后停止推流时间
rtmp_idle_timeout = 300
# 最大并发推流数量
rtmp_max_streams = 10
# 不转码，节省 CPU
rtmp_transcode_mode = copy
